
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Coin Collector Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #14532d;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }

        #game {
            width: min(500px, 100%);
            aspect-ratio: 10 / 7;
            background: white;
            margin: 15px auto;
            border: 4px solid #22c55e;
            position: relative;
            overflow: hidden;
        }

        #player {
            width: 7%;
            aspect-ratio: 1;
            background: #16a34a;
            position: absolute;
            left: 4%;
            bottom: 6%;
        }

        #coin {
            width: 5%;
            aspect-ratio: 1;
            background: gold;
            border: 3px solid #ca8a04;
            border-radius: 50%;
            position: absolute;
            top: 15%;
            left: 46%;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(2, 55px);
            justify-content: center;
            gap: 8px;
            margin: 15px auto;
        }

        #controls button {
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            touch-action: manipulation;
        }

        #controls button:active {
            background: #15803d;
        }

        #up {
            grid-column: 2;
        }

        #left {
            grid-column: 1;
            grid-row: 2;
        }

        #down {
            grid-column: 2;
            grid-row: 2;
        }

        #right {
            grid-column: 3;
            grid-row: 2;
        }

        #restart {
            background: white;
            color: #14532d;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Coin Collector Game</h1>
    <p>Collect as many coins as you can!</p>

    <p id="score">Score: 0</p>
    <p id="highscore">High Score: 0</p>
    <p id="timer">Time: 60</p>

    <button id="restart">Play Again</button>

    <div id="game">
        <div id="player"></div>
        <div id="coin"></div>
    </div>

    <p>Use the buttons to move!</p>

    <div id="controls">
       <button id="up">↑</button>
       <button id="left">←</button>
       <button id="down">↓</button>
       <button id="right">→</button>
    </div>

    <script>
        const player = document.getElementById("player");
        const coin = document.getElementById("coin");
        const game = document.getElementById("game");

        const scoreDisplay = document.getElementById("score");
        const highScoreDisplay = document.getElementById("highscore");
        const timerDisplay = document.getElementById("timer");
        const restartButton = document.getElementById("restart");

        let x = 20;
        let y = 20;
        let score = 0;
        let timeLeft = 60;

        let highScore =
            Number(localStorage.getItem("coinHighScore")) || 0;

        let gameStarted = false;
        let gameOver = false;
        let countdown = null;

        highScoreDisplay.textContent = "High Score: " + highScore;

        function startTimer() {
            if (gameStarted) return;

            gameStarted = true;

            countdown = setInterval(function() {
                timeLeft--;

                timerDisplay.textContent = "Time: " + timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    gameOver = true;
                    timerDisplay.textContent = "TIME'S UP!";
                }
            }, 1000);
        }

        function movePlayer(direction) {
            if (gameOver) return;

            if (direction === "right") x += 12;
            if (direction === "left") x -= 12;
            if (direction === "up") y += 12;
            if (direction === "down") y -= 12;

            const maxX = game.clientWidth - player.offsetWidth;
            const maxY = game.clientHeight - player.offsetHeight;

            x = Math.max(0, Math.min(maxX, x));
            y = Math.max(0, Math.min(maxY, y));

            player.style.left = x + "px";
            player.style.bottom = y + "px";

            startTimer();

            checkCollision();
        }
        let holdInterval = null;

        function startMoving(direction) {
            if (gameOver || holdInterval !== null) return;

            movePlayer(direction);

            holdInterval = setInterval(function() {
                movePlayer(direction);
            }, 100);
        }

        function stopMoving() {
            clearInterval(holdInterval);
            holdInterval = null;
        }

        document.querySelectorAll("#controls button").forEach(function(button) {
            button.addEventListener("pointerdown", function(event) {
                event.preventDefault();
                startMoving(button.id);
            });
        });

        document.addEventListener("pointerup", stopMoving);
        document.addEventListener("pointercancel", stopMoving);
        function checkCollision() {
            const playerRect = player.getBoundingClientRect();
            const coinRect = coin.getBoundingClientRect();

            if (
                playerRect.left < coinRect.right &&
                playerRect.right > coinRect.left &&
                playerRect.top < coinRect.bottom &&
                playerRect.bottom > coinRect.top
            ) {
                score++;

                scoreDisplay.textContent = "Score: " + score;

                if (score > highScore) {
                    highScore = score;

                    localStorage.setItem("coinHighScore", highScore);

                    highScoreDisplay.textContent =
                        "High Score: " + highScore;
                }

                const maxCoinX =
                    game.clientWidth - coin.offsetWidth;

                const maxCoinY =
                    game.clientHeight - coin.offsetHeight;

                coin.style.left =
                    Math.floor(Math.random() * (maxCoinX + 1)) + "px";

                coin.style.top =
                    Math.floor(Math.random() * (maxCoinY + 1)) + "px";
            }
        }

        document.addEventListener("keydown", function(event) {
            const keys = {
                ArrowRight: "right",
                ArrowLeft: "left",
                ArrowUp: "up",
                ArrowDown: "down"
            };

            if (keys[event.key]) {
                event.preventDefault();
                movePlayer(keys[event.key]);
            }
        });

        restartButton.addEventListener("click", function() {
            stopMoving();
            clearInterval(countdown);

            x = 20;
            y = 20;
            score = 0;
            timeLeft = 60;

            gameStarted = false;
            gameOver = false;
            countdown = null;

            player.style.left = x + "px";
            player.style.bottom = y + "px";

            coin.style.left = "46%";
            coin.style.top = "15%";

            scoreDisplay.textContent = "Score: 0";
            timerDisplay.textContent = "Time: 60";
        });
    </script>

</body>
</html>
